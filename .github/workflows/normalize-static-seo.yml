name: One-shot static SEO normalization

on:
  push:
    branches:
      - fix/sitemap-index-non-www

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[seo-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sitemap-index-non-www
          fetch-depth: 0

      - name: Normalize canonical host and generate complete sitemap
        run: python .github/scripts/fix_static_seo.py

      - name: Validate generated files
        run: |
          git diff --check
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ("page-sitemap.xml", "content-sitemap.xml", "sitemap_index.xml"):
              ET.parse(name)
              print("valid:", name)
          PY

      - name: Commit generated static SEO files
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Normalize canonical host and complete sitemap [seo-normalized]"
          git push origin HEAD:fix/sitemap-index-non-www
